<mat-sidenav-container class="shell">
     <mat-sidenav class="sidebar" mode="side" opened>
          <div class="brand">HR Admin</div>

          <mat-nav-list>
               <a mat-list-item routerLink="/employees" routerLinkActive="active">
                    <mat-icon>groups</mat-icon>
                    <span>Employees</span>
               </a>

               <a mat-list-item routerLink="/leave" routerLinkActive="active">
                    <mat-icon>event_available</mat-icon>
                    <span>Leave</span>
               </a>

               <a mat-list-item routerLink="/admin" routerLinkActive="active">
                    <mat-icon>admin_panel_settings</mat-icon>
                    <span>Admin</span>
               </a>
          </mat-nav-list>
     </mat-sidenav>

     <mat-sidenav-content class="content">
          <mat-toolbar class="topbar">
               <span class="title">HR Admin Portal</span>
               <span class="spacer"></span>

               <!-- optional: top search later -->
               <button mat-icon-button aria-label="Notifications">
                    <mat-icon>notifications</mat-icon>
               </button>
               <button mat-icon-button aria-label="Profile">
                    <mat-icon>account_circle</mat-icon>
               </button>
          </mat-toolbar>

          <div class="page">
               <router-outlet></router-outlet>
          </div>
     </mat-sidenav-content>
</mat-sidenav-container>
